site_name: Phiau's Website

theme:
  name: material
  icon:
    logo: material/github # 网站logo更改
  language: zh
  palette:             # 明暗模式和颜色更改
    - media: "(prefers-color-scheme)" # Palette toggle for automatic mode
      toggle:
        icon: material/brightness-auto
        name: Switch to another mode
    - media: "(prefers-color-scheme: light)" # 明
      scheme: default
      primary: teal       # for the header, the sidebar, text links and several other components
      accent: deep purple # denote elements that can be interacted with, e.g. hovered links, buttons and scrollbars
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode # 改提示词处（光标放在按钮上显示的提示词）
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.tabs  # 顶部分类标签
    - navigation.top   # 返回顶部按钮
    - search.highlight # 搜索结果高亮

nav:
  - Home: index.md
  - Course:
    - TOC: Content/Course/index.md
  - Research:
    - TOC: Content/Research/index.md
  - Website:
    - Operations: Content/Website/operations.md

# Markdown 扩展（核心部分，对应.md语法需求）
markdown_extensions:
  - toc: # 目录支持
      permalink: true # 生成锚点链接
  - pymdownx.arithmatex: # 数学公式
      generic: true
  - pymdownx.highlight: # 代码部分
      anchor_linenums: true # 代码行号
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite # 行内代码高亮
  - pymdownx.superfences # 支持复杂的代码块嵌套
  - pymdownx.snippets     # 支持代码片段导入
  - pymdownx.tasklist: # 列表
      custom_checkbox: true # 漂亮的复选框样式
  - pymdownx.betterem: # 字体设置 # 优化粗体和斜体
      smart_enable: All
  - pymdownx.caret # 支持上标^和下划线_
  - pymdownx.mark  # 支持高亮====
  - pymdownx.tilde # 支持删除线~~~~
  - footnotes # 脚注
  - attr_list # 图片允许调整大小 # 允许使用{: width="300"} 语法调整图片
  # 额外
  - admonition # 漂亮的提示框
  - pymdownx.details # 折叠详情
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# 额外的JavaScript（用于数学公式的渲染）
extra_javascript:
  - javascripts/mathjax.js # 本地文件
  # - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/extra.css # 新增，用于给表格加横线
